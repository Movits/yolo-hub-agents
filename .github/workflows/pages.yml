name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static frontend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          mkdir -p _site
          cp -a public/. _site/
          node -e "const fs=require('node:fs'); const apiBaseUrl=String(process.env.BACKEND_URL || '').trim(); fs.writeFileSync('_site/config.js', '// Gerado automaticamente pelo deploy do GitHub Pages.\\nwindow.YOLO_HUB_CONFIG = Object.freeze(' + JSON.stringify({ apiBaseUrl }) + ');\\n');"
          touch _site/.nojekyll
          node --check _site/app.js
          node --check _site/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
