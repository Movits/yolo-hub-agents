name: Verify agent platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check repository secrets
        run: corepack pnpm secrets:check

      - name: Reject real data in public scaffold
        run: corepack pnpm public-data:check:history

      - name: Reject mutations to published releases
        if: github.event_name == 'pull_request'
        run: corepack pnpm releases:check --base-ref origin/${{ github.base_ref }}

      - name: Reject direct mutations on main
        if: github.event_name != 'pull_request' && github.event.before != '0000000000000000000000000000000000000000'
        run: corepack pnpm releases:check --base-ref ${{ github.event.before }}

      - name: Validate releases on initial push
        if: github.event_name != 'pull_request' && github.event.before == '0000000000000000000000000000000000000000'
        run: corepack pnpm releases:check

      - name: Compile and evaluate every brain
        env:
          RELEASE_TRUSTED_PUBLIC_KEYS: ${{ vars.RELEASE_TRUSTED_PUBLIC_KEYS }}
        run: corepack pnpm brain:check-all

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
