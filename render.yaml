services:
  - type: web
    name: yolo-hub-agents-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: COMPANY_CONFIG_PATH
        value: ./config/company.example.json
      - key: DEMO_HOSTED
        value: "true"
      - key: ENABLE_SIMULATOR
        value: "false"
      - key: ENABLE_DEBUG_ENDPOINTS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://movits.github.io
      - key: SIMULATOR_API_TOKEN
        sync: false
      - key: SIMULATOR_RATE_LIMIT_MAX
        value: "60"
      - key: SIMULATOR_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: TRUST_PROXY
        value: "true"
      - key: WEBHOOK_PROCESSING_MODE
        value: sync
      - key: WHATSAPP_SEND_ENABLED
        value: "false"
      - key: REQUIRE_WEBHOOK_SIGNATURE
        value: "false"
