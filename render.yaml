services:
  - type: web
    name: yolo-hub-agents-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: AGENT_ID
        value: empresa-modelo
      - key: AGENT_RELEASE_VERSION
        value: "1.0.0"
      - key: AGENT_RELEASE_MANIFEST_SHA256
        value: 88ac89ba12849303d140fc9a667de1d5d7a21d511253d3a345d953ddc275abd0
      - key: AGENT_RELEASES_ROOT
        value: ./config/releases
      - key: DEMO_HOSTED
        value: "true"
      - key: ENABLE_SIMULATOR
        value: "false"
      - key: ENABLE_DEBUG_ENDPOINTS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://movits.github.io
      - key: SIMULATOR_API_TOKEN
        sync: false
      - key: SIMULATOR_RATE_LIMIT_MAX
        value: "20"
      - key: SIMULATOR_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: TRUST_PROXY
        value: "true"
      - key: WEBHOOK_PROCESSING_MODE
        value: sync
      - key: WHATSAPP_SEND_ENABLED
        value: "false"
      - key: REQUIRE_WEBHOOK_SIGNATURE
        value: "false"
